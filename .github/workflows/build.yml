name: Build VoiceBridgeProbe

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib
        shell: bash
        run: |
          set -e

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          rm -rf build
          mkdir -p build

          clang \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fobjc-runtime=ios-15.0 \
            -O2 \
            -Wall \
            -Wextra \
            -framework Foundation \
            -framework UIKit \
            InjectTest.m \
            -o build/VoiceBridgeProbe.dylib

      - name: Verify dylib
        shell: bash
        run: |
          set -e

          echo "===== file ====="
          file build/VoiceBridgeProbe.dylib

          echo "===== architecture ====="
          lipo -info build/VoiceBridgeProbe.dylib

          echo "===== load commands ====="
          otool -l build/VoiceBridgeProbe.dylib | grep -A5 -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS" || true

          echo "===== exported symbols ====="
          nm -gU build/VoiceBridgeProbe.dylib | head -50 || true

          echo "===== strings ====="
          strings build/VoiceBridgeProbe.dylib |
            grep -Ei "VoiceBridgeProbe|voice|tts|speech|audio|synthesis|send|message" |
            head -100 || true

      - name: Strip debug symbols from dylib
        shell: bash
        run: |
          set -e

          strip \
            -S \
            build/VoiceBridgeProbe.dylib

          file build/VoiceBridgeProbe.dylib
          lipo -info build/VoiceBridgeProbe.dylib

      - name: Package
        shell: bash
        run: |
          set -e

          cd build

          zip -9 \
            VoiceRebuildInjectTest-dylib.zip \
            VoiceBridgeProbe.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRebuildInjectTest-dylib
          path: build/VoiceRebuildInjectTest-dylib.zip
          if-no-files-found: error
