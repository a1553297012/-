name: Build VoiceBridgeProbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make ldid-procursus

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"

          make clean || true
          make

      - name: Locate real dylib
        run: |
          set -e

          echo "=== All dylib files ==="
          find .theos -type f -name "*.dylib" -print

          echo "=== Searching VoiceBridgeProbe.dylib ==="

          DYLIB="$(find .theos -type f \
            -name "VoiceBridgeProbe.dylib" \
            -not -path "*.dSYM/*" \
            | head -n 1)"

          if [ -z "$DYLIB" ]; then
            echo "ERROR: VoiceBridgeProbe.dylib not found"
            exit 1
          fi

          echo "Found:"
          echo "$DYLIB"

          echo "=== Mach-O identification ==="
          file "$DYLIB"

          echo "=== Architecture ==="
          lipo -info "$DYLIB"

          echo "=== Mach-O header ==="
          otool -hv "$DYLIB"

          mkdir -p output
          cp "$DYLIB" output/VoiceBridgeProbe.dylib

      - name: Verify output
        run: |
          set -e

          test -f output/VoiceBridgeProbe.dylib

          echo "=== FINAL FILE ==="
          ls -lh output/VoiceBridgeProbe.dylib

          echo "=== FILE TYPE ==="
          file output/VoiceBridgeProbe.dylib

          echo "=== ARCHITECTURE ==="
          lipo -info output/VoiceBridgeProbe.dylib

          echo "=== CHECK dSYM ==="
          if file output/VoiceBridgeProbe.dylib | grep -qi "dSYM"; then
            echo "ERROR: dSYM was selected!"
            exit 1
          fi

          echo "=== DYLIB CHECK PASSED ==="

      - name: Upload VoiceBridgeProbe.dylib
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBridgeProbe-dylib
          path: output/VoiceBridgeProbe.dylib
          if-no-files-found: error
