name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid-procursus

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          make clean
          make

      - name: Find dylib
        run: |
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \;
          ls -la output

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRebuildInjectTest-dylib
          path: output/*.dylib
