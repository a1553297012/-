name: Build VoiceBridgeProbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid-procursus

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          make clean
          make package FINALPACKAGE=1

      - name: Find package
        run: |
          mkdir -p output
          find packages -name "*.deb" -exec cp {} output/ \;
          find output -type f -maxdepth 1 -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBridgeProbe-deb
          path: output/*.deb
