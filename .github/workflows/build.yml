name: Build VoiceBridgeProbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install make ldid-procursus

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== MAKEFILE ==="
          cat Makefile

          echo "=== BUILD ==="
          make clean || true
          make

      - name: Find and verify dylib
        run: |
          set -e

          echo "================================"
          echo "SEARCHING ALL DYLIB FILES"
          echo "================================"

          find .theos -type f -name "*.dylib" -print

          echo "================================"
          echo "SEARCHING REAL VOICEBRIDGEPROBE"
          echo "================================"

          DYLIBS=$(find .theos -type f \
            -name "VoiceBridgeProbe.dylib" \
            -not -path "*/.dSYM/*" \
            -not -path "*/dSYM/*")

          echo "$DYLIBS"

          COUNT=$(echo "$DYLIBS" | grep -c "VoiceBridgeProbe.dylib" || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No VoiceBridgeProbe.dylib found"
            exit 1
          fi

          DYLIB=$(echo "$DYLIBS" | head -n 1)

          echo "================================"
          echo "SELECTED DYLIB"
          echo "================================"
          echo "$DYLIB"

          echo "================================"
          echo "FILE"
          echo "================================"
          file "$DYLIB"

          echo "================================"
          echo "LIPO"
          echo "================================"
          lipo -info "$DYLIB"

          echo "================================"
          echo "MACH-O HEADER"
          echo "================================"
          otool -hv "$DYLIB"

          echo "================================"
          echo "CHECKING FOR DSYM"
          echo "================================"

          if file "$DYLIB" | grep -qi "dSYM"; then
            echo "ERROR: SELECTED FILE IS A DSYM"
            exit 1
          fi

          echo "DSYM CHECK PASSED"

          echo "================================"
          echo "CHECKING MACH-O FILETYPE"
          echo "================================"

          HEADER=$(otool -hv "$DYLIB" | tail -n +2)

          echo "$HEADER"

          if echo "$HEADER" | grep -q "MH_DSYM"; then
            echo "ERROR: MH_DSYM DETECTED"
            exit 1
          fi

          echo "MACH-O FILETYPE CHECK PASSED"

          echo "================================"
          echo "COPYING FINAL DYLIB"
          echo "================================"

          mkdir -p output

          cp "$DYLIB" output/VoiceBridgeProbe.dylib

          echo "================================"
          echo "FINAL OUTPUT"
          echo "================================"

          ls -lh output/VoiceBridgeProbe.dylib
          file output/VoiceBridgeProbe.dylib
          lipo -info output/VoiceBridgeProbe.dylib
          otool -hv output/VoiceBridgeProbe.dylib

      - name: Final validation
        run: |
          set -e

          FILE="output/VoiceBridgeProbe.dylib"

          echo "================================"
          echo "FINAL VALIDATION"
          echo "================================"

          test -f "$FILE"

          echo "FILE:"
          file "$FILE"

          echo "ARCH:"
          lipo -info "$FILE"

          echo "HEADER:"
          otool -hv "$FILE"

          if file "$FILE" | grep -qi "dSYM"; then
            echo "ERROR: FINAL FILE IS DSYM"
            exit 1
          fi

          if otool -hv "$FILE" | grep -q "MH_DSYM"; then
            echo "ERROR: FINAL FILE IS MH_DSYM"
            exit 1
          fi

          echo "================================"
          echo "SUCCESS"
          echo "================================"

      - name: Upload VoiceBridgeProbe.dylib
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBridgeProbe-dylib
          path: output/VoiceBridgeProbe.dylib
          if-no-files-found: error
